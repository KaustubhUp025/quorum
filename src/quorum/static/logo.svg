<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40" role="img" aria-label="Quorum">
  <defs>
    <linearGradient id="qg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Quorum mark: a ring of consensus nodes around a center -->
  <g transform="translate(20,20)">
    <circle r="14" fill="none" stroke="url(#qg)" stroke-width="3"/>
    <circle cx="0" cy="-14" r="3.2" fill="#a855f7"/>
    <circle cx="12.1" cy="7" r="3.2" fill="#6366f1"/>
    <circle cx="-12.1" cy="7" r="3.2" fill="#6366f1"/>
    <circle cx="0" cy="0" r="3" fill="#e2e8f0"/>
    <!-- the "tail" turning the ring into a Q -->
    <line x1="7" y1="9" x2="15" y2="17" stroke="url(#qg)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="44" y="27" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial" font-size="22" font-weight="700" fill="#e2e8f0">Quorum</text>
</svg>
