# Single source of truth for the Quorum Cloud Run service's PLAIN (non-secret) env.
# Verified against the live `quorum` service (us-central1) on 2026-06-16 — these 6 vars
# match the running revision exactly. Secrets are injected separately via --set-secrets
# in deploy/cloud_run.sh (gitlab-token, gemini-key, github-token, webhook-secret).
#
# IMPORTANT: gcloud `--env-vars-file` REPLACES the entire plain-env set on each deploy.
# Every var the service needs must be listed here, or it is silently dropped from the
# live service. Do not remove a key without confirming the service no longer needs it.
QUORUM_CREATE_FIX_MRS: "true"
QUORUM_CORRELATE_CI: "true"
QUORUM_USE_VERTEX_AI: "true"
QUORUM_GOOGLE_CLOUD_PROJECT: "gen-lang-client-0294573094"
QUORUM_GOOGLE_CLOUD_LOCATION: "us-central1"
QUORUM_MCP_MODE: "glab"
